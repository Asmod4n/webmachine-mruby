name: test

# A push that changes only documentation runs nothing: the suite
# answers for the code, and the docs are not read by it. A tag push
# ignores the path filter, so a release still runs everything.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

jobs:
  # The debug build, and every test the tree has: mruby's own, this
  # gem's unit tests, and the bintests against the debug binary. A KO
  # or a crash anywhere fails the push.
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: install what a build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ruby git pkg-config zlib1g-dev libssl-dev
      - name: build the debug config and run every test
        run: |
          MRUBY_CONFIG=build_config_debug.rb rake test 2>&1 | tee test.log
          test "${PIPESTATUS[0]}" -eq 0
          # The totals are the record: no KO and no crash, anywhere.
          if grep -Eq '^ *(KO|Crash): [1-9]' test.log; then
            echo 'a test failed or crashed' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-build
          path: |
            test.log
            mruby/build/debug/bin/webmachine-server
            mruby/build/debug/bin/webmachine-logd
            mruby/build/debug/bin/mrbc

  # The release build, which the suite never makes: `rake test` is the
  # debug build's, and a debug run cannot answer for a binary it never
  # made. ship_smoke builds the host config and checks that the binary
  # starts and answers 200. It runs beside the suite, not after it - a
  # release build that does not compile is its own failure.
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: install what a build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ruby git pkg-config zlib1g-dev libssl-dev
      - name: build the host config and smoke the binary
        # The runner is a shared machine and migrates between hosts, so
        # -march=native would compile for one and run on another. The
        # host config asks WM_MARCH for exactly this case.
        env:
          WM_MARCH: x86-64-v2
        run: rake ship_smoke

  # The same tests, with the sanitizers watching. The address and
  # undefined behaviour sanitizers are one build, the thread sanitizer
  # is the other - the two refuse each other in one binary. Both are
  # clang builds, and both run the whole suite: mruby's own tests, the
  # unit tests and the bintests.
  #
  # What each one answers: ASan says a use after free or an overflow at
  # the moment it happens, and TSan names a race whether or not it
  # fired. A run that stops on a runner and never on a workstation is
  # what both are here for.
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        san: [asan, tsan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: install what a build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ruby git pkg-config zlib1g-dev libssl-dev
      - name: build with the sanitizer and run every test
        env:
          # detect_leaks is off: mruby frees its heap at exit, and the
          # gems it loads do not, so the leak check reports the gems
          # rather than this server. halt_on_error stops the process at
          # the first report, so the test that was running fails and
          # says which one it was.
          # log_path, because a report on stderr is lost: the bintests
          # give every server the same log file per tag, and the next
          # server with that tag writes over it. log_path gives each
          # process a file of its own, named by its pid.
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:log_path=/tmp/asan-report
          TSAN_OPTIONS: halt_on_error=1:log_path=/tmp/tsan-report
        run: |
          rake "san_test[${{ matrix.san }}]" 2>&1 | tee "${{ matrix.san }}.log"
          test "${PIPESTATUS[0]}" -eq 0
          if grep -Eq '^ *(KO|Crash): [1-9]' "${{ matrix.san }}.log"; then
            echo 'a test failed or crashed' >&2
            exit 1
          fi
      - name: collect the server logs
        if: always()
        # A sanitizer writes its report to the server's stderr, and the
        # bintests keep that in /tmp. The report says more than the
        # failed assertion does.
        run: |
          mkdir -p san-logs
          cp /tmp/wm*-stderr-*.log san-logs/ 2>/dev/null || true
          cp /tmp/*san-report.* san-logs/ 2>/dev/null || true
          for f in san-logs/*san-report.*; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            head -60 "$f"
          done
          ls san-logs/*san-report.* >/dev/null 2>&1 || echo 'no sanitizer report'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.san }}
          path: |
            ${{ matrix.san }}.log
            san-logs

  # The external oracles, against the debug binary the suite job made:
  # h2spec for RFC 9113 and RFC 7541, the Autobahn fuzzingclient for
  # RFC 6455. Both are containers; the runner has docker.
  conformance:
    runs-on: ubuntu-latest
    needs: suite
    # h2spec on every push, Autobahn on a release tag alone - the step
    # below says why. The Autobahn step is bounded on its own as well,
    # so the report and the server's logs still reach the artifact;
    # this is the ceiling for the whole job.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: debug-build
      - name: make the binaries runnable again
        run: chmod +x mruby/build/debug/bin/webmachine-server mruby/build/debug/bin/webmachine-logd mruby/build/debug/bin/mrbc
      - name: h2spec
        env:
          BIN: mruby/build/debug/bin/webmachine-server
          MRBC: mruby/build/debug/bin/mrbc
        run: |
          tools/conformance.sh h2
          # 3.5/2 is a known refusal, not a gap: tools/conformance.sh
          # says why. Any other failure is real.
          ruby -e '
            log = File.read("build/conformance/h2spec.log")
            m = log.match(/(\d+) tests, (\d+) passed, (\d+) skipped, (\d+) failed/)
            abort "no h2spec summary in the log" unless m
            failed = m[4].to_i
            known = log.include?("Sends invalid connection preface") ? 1 : 0
            abort "h2spec: #{failed} failed, #{known} of them the known preface refusal" if failed > known
            puts "h2spec: #{m[2]} passed, #{failed} failed (#{known} known)"
          '
      - name: Autobahn
        # Only on a release tag. The 517 cases take 9 minutes, and they
        # answer for the WebSocket layer, which one push in fifty
        # touches. h2spec above stays on every push - it takes 11
        # seconds.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BIN: mruby/build/debug/bin/webmachine-server
          MRBC: mruby/build/debug/bin/mrbc
        run: |
          # What this runner is: the kernel, the cores, and whether
          # io_uring is switched off.
          uname -r; nproc
          cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 'no io_uring_disabled knob'
          # Every case together takes 9 minutes here, and the deflate
          # cases 12.x and 13.x are almost all of it. wstest does not
          # exit when its report step raises, so a run past this budget
          # ends, and the log says which case it was on.
          if ! timeout 3600 tools/conformance.sh ws; then
            echo '--- the server log ---'
            tail -50 build/conformance/server.log || true
            echo '--- the last case ---'
            grep 'Running test case' build/conformance/autobahn.log | tail -3 || true
            exit 1
          fi
          ruby -rjson -e '
            report = JSON.parse(File.read("build/conformance/reports/index.json"))
            bad = []
            report.each_value do |cases|
              cases.each do |name, r|
                ok = %w[OK INFORMATIONAL NON-STRICT UNIMPLEMENTED].include?(r["behavior"]) &&
                     %w[OK INFORMATIONAL NON-STRICT UNIMPLEMENTED].include?(r["behaviorClose"])
                bad << "#{name}: #{r["behavior"]}/#{r["behaviorClose"]}" unless ok
              end
            end
            abort "Autobahn: #{bad.size} case(s) failed:\n#{bad.join("\n")}" unless bad.empty?
            puts "Autobahn: every case passed"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance
          path: build/conformance
